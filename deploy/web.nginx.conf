# Serves the website at / and the dashboard at /app/. TLS and routing are
# Traefik's; this only hands out files.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    location / {
        try_files $uri $uri/ =404;
    }

    # The dashboard switches views in the browser; any unknown path under /app/
    # is still the dashboard.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Hashed filenames, so they can be cached for good.
    location ^~ /app/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The site's own files are not hashed, so they revalidate on every visit.
    location ~ \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ^~ /public/ {
        expires 7d;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
